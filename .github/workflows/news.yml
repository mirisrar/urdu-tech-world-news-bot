name: News Bot

on:
  schedule:
    # Every 5 minutes — create Facebook *native Scheduled* posts (staggered).
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run | repair_image | clear_fb_schedule"
        required: false
        default: "run"
        type: choice
        options:
          - run
          - repair_image
          - clear_fb_schedule
      news_id:
        description: "For repair_image — news.id (e.g. 2836)"
        required: false
        type: string
        default: ""
      source_page_url:
        description: "For repair_image — optional publisher URL for og:image"
        required: false
        type: string
        default: ""

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run:
    if: ${{ github.event_name == 'schedule' || (github.event.inputs.mode != 'repair_image' && github.event.inputs.mode != 'clear_fb_schedule') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # Persist Facebook posted-IDs + daily cadence across runs.
      - uses: actions/cache@v4
        with:
          path: .bot-publish-state
          key: bot-publish-state-${{ github.run_id }}
          restore-keys: |
            bot-publish-state-

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: node index.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # REQUIRED for Facebook dedupe: without this, RLS blocks fb_post_id
          # updates and the same posts get published again every run.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BOT_PUBLISH_STATE_DIR: .bot-publish-state
          MAX_ITEMS_PER_SOURCE: "25"
          MAX_ITEMS_PER_RUN: "40"
          AI_CALL_SPACING_MS: "1000"
          # No fixed default image. If article has no cover → Unsplash/Pexels
          # by topic/category; if that fails → skip the news.
          SKIP_IF_NO_TOPIC_IMAGE: "true"
          STOCK_IMAGE_PROVIDER: "auto"
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # Nexora website article URL in Facebook caption (after text, before #tags).
          # Secret optional — code defaults to https://www.nexoranewsurdu.com
          WEBSITE_BASE_URL: ${{ secrets.WEBSITE_BASE_URL }}
          WEBSITE_ARTICLE_PATH: "/article.html?id={id}"
          # Meta Scheduled: today's important news only (Asia/Karachi calendar day).
          # After midnight, yesterday is never fetched into schedule.
          FACEBOOK_USE_QUEUE: "true"
          FACEBOOK_SCHEDULE_GAP_MS: "300000"
          # Do not stack new posts days ahead behind old backlog (max 12h / today).
          FACEBOOK_SCHEDULE_MAX_AHEAD_HOURS: "12"
          FACEBOOK_MAX_SCHEDULES_PER_RUN: "20"
          FACEBOOK_QUEUE_BACKFILL_LIMIT: "20"
          FACEBOOK_QUEUE_BACKFILL_MIN_NEWS_ID: "0"
          FACEBOOK_QUEUE_RETRY_MAX_AGE_HOURS: "24"
          FACEBOOK_SAME_DAY_ONLY: "true"
          FACEBOOK_TIMEZONE: "Asia/Karachi"
          # Only important news: Pakistan / Politics / World (or featured=true).
          FACEBOOK_IMPORTANT_ONLY: "true"
          FACEBOOK_IMPORTANT_CATEGORIES: "Pakistan,Politics,World"
          FACEBOOK_MAX_AGE_HOURS: "24"
          FACEBOOK_MAX_POSTS_PER_DAY: "288"
          FACEBOOK_MAX_POSTS_PER_RUN: "1"
          FACEBOOK_MIN_GAP_MS: "300000"
          FACEBOOK_POST_INTERVAL_MS: "0"
          # Phase 9 — title dedupe + DB publish retry (no Redis).
          TITLE_DEDUPE_LOOKBACK: "200"
          TITLE_SIMILARITY_THRESHOLD: "0.72"
          PUBLISH_RETRY_LIMIT: "10"
          PUBLISH_RETRY_LOOKBACK_HOURS: "48"
          # Optional — each source/channel below is skipped automatically if
          # its secrets aren't set. Add only the ones you actually use.
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Outbound scrape→channel posts OFF for now (editor ingest still uses token).
          PUBLISH_TELEGRAM: "false"
          PUBLISH_X: "false"
          # Editor ingest (photo+caption → inbox). Comma-separated Telegram user ids.
          TELEGRAM_EDITOR_IDS: ${{ secrets.TELEGRAM_EDITOR_IDS }}
          TELEGRAM_INGEST_ENABLED: "true"
          TELEGRAM_PUBLISH_MAX_PER_RUN: "5"
          # Phase 8 — optional ops alert chat (falls back to TELEGRAM_CHAT_ID).
          # TELEGRAM_ALERT_MODE: always | failures | off (default always).
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          TELEGRAM_ALERT_MODE: ${{ secrets.TELEGRAM_ALERT_MODE }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_TEMPLATE_NAME: ${{ secrets.WHATSAPP_TEMPLATE_NAME }}
          WHATSAPP_RECIPIENT_NUMBERS: ${{ secrets.WHATSAPP_RECIPIENT_NUMBERS }}
          # Phase 5 (image pipeline) — both optional, sensible defaults/fallbacks apply if unset.
          SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
          DEFAULT_FALLBACK_IMAGE_URL: ${{ secrets.DEFAULT_FALLBACK_IMAGE_URL }}

  repair_image:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'repair_image' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Repair article image
        run: node scripts/repair-article-image.js
        env:
          NEWS_ID: ${{ github.event.inputs.news_id }}
          SOURCE_PAGE_URL: ${{ github.event.inputs.source_page_url }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          STOCK_IMAGE_PROVIDER: "auto"

  clear_fb_schedule:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'clear_fb_schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Delete all Facebook scheduled posts
        run: node scripts/clear-facebook-scheduled.js
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
