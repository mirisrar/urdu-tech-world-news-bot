<!doctype html>
<!-- Reference example only — Article Page wiring. -->
<html lang="ur" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>خبر — Nexora News Urdu</title>
    <meta id="meta-description" name="description" content="" />
    <meta id="meta-keywords" name="keywords" content="" />
    <link id="canonical-link" rel="canonical" href="" />
    <meta id="og-headline" property="og:title" content="" />
    <meta id="og-description" property="og:description" content="" />
    <meta id="og-image" property="og:image" content="" />
    <meta id="og-url" property="og:url" content="" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta id="twitter-title" name="twitter:title" content="" />
    <meta id="twitter-description" name="twitter:description" content="" />
    <meta id="twitter-image" name="twitter:image" content="" />
  </head>
  <body>
    <article id="article-container">
      <p>لوڈ ہو رہا ہے...</p>
    </article>

    <script type="module">
      import { getArticleById } from "../newsApi.js";
      import { applyArticleSeoMeta, formatRelativeTime, resolveImageUrl } from "../utils.js";

      function renderArticle(article) {
        const container = document.getElementById("article-container");

        if (!article) {
          container.innerHTML = "<p>یہ خبر دستیاب نہیں ہے۔</p>";
          return;
        }

        // On-page H1 = urdu_title; <title>/meta/OG = seo_* fields from DB.
        applyArticleSeoMeta(article);

        const credit = (article.image_credit || "").trim();
        container.innerHTML = `
          <img src="${resolveImageUrl(article.image_url)}" alt="${article.urdu_title}" />
          ${credit ? `<p class="image-credit">${credit}</p>` : ""}
          <span class="category-tag">${article.category}</span>
          <h1>${article.urdu_title}</h1>
          <span class="meta">${article.source} • ${formatRelativeTime(article.created_at)}</span>
          <p class="summary">${article.urdu_summary}</p>
          <div class="body">${article.article.replace(/\n/g, "<br>")}</div>
          <p class="hashtags">${article.hashtags || ""}</p>
          <a class="source-link" href="${article.url}" target="_blank" rel="noopener">اصل ماخذ دیکھیں</a>
        `;
      }

      async function init() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");

        if (!id) {
          renderArticle(null);
          return;
        }

        const article = await getArticleById(id);
        renderArticle(article);
      }

      init().catch((error) => {
        console.error("Failed to load article:", error);
        document.getElementById("article-container").innerHTML = "<p>خبر لوڈ کرنے میں مسئلہ پیش آیا۔</p>";
      });
    </script>
  </body>
</html>
