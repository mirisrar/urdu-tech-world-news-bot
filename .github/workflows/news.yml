name: News Bot

on:
  schedule:
    # Every 4 hours — pairs with FACEBOOK_MAX_POSTS_PER_DAY=6 + MIN_GAP ~4h
    # so the Page gets at most ~6 spaced posts/day after the pause ends.
    - cron: "0 */4 * * *"
  workflow_dispatch:

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # Persist Facebook posted-IDs + daily cadence across runs.
      - uses: actions/cache@v4
        with:
          path: .bot-publish-state
          key: bot-publish-state-${{ github.run_id }}
          restore-keys: |
            bot-publish-state-

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: node index.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # REQUIRED for Facebook dedupe: without this, RLS blocks fb_post_id
          # updates and the same posts get published again every run.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BOT_PUBLISH_STATE_DIR: .bot-publish-state
          MAX_ITEMS_PER_SOURCE: "25"
          MAX_ITEMS_PER_RUN: "40"
          AI_CALL_SPACING_MS: "1000"
          # Skip news when no real article cover exists (RSS/og/publisher).
          # No stock Unsplash placeholders for new inserts.
          REQUIRE_ORIGINAL_ARTICLE_IMAGE: "true"
          # Facebook cool-down after spam detect: no posts for 72h, then
          # max 6 posts/day with ~4h gaps (1 post per Actions run).
          FACEBOOK_PAUSE_UNTIL: "2026-08-01T10:43:20Z"
          FACEBOOK_MAX_POSTS_PER_DAY: "6"
          FACEBOOK_MAX_POSTS_PER_RUN: "1"
          FACEBOOK_MIN_GAP_MS: "14400000"
          FACEBOOK_POST_INTERVAL_MS: "0"
          # Phase 9 — title dedupe + DB publish retry (no Redis).
          TITLE_DEDUPE_LOOKBACK: "200"
          TITLE_SIMILARITY_THRESHOLD: "0.72"
          PUBLISH_RETRY_LIMIT: "10"
          PUBLISH_RETRY_LOOKBACK_HOURS: "48"
          # Optional — each source/channel below is skipped automatically if
          # its secrets aren't set. Add only the ones you actually use.
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Phase 8 — optional ops alert chat (falls back to TELEGRAM_CHAT_ID).
          # TELEGRAM_ALERT_MODE: always | failures | off (default always).
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          TELEGRAM_ALERT_MODE: ${{ secrets.TELEGRAM_ALERT_MODE }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_TEMPLATE_NAME: ${{ secrets.WHATSAPP_TEMPLATE_NAME }}
          WHATSAPP_RECIPIENT_NUMBERS: ${{ secrets.WHATSAPP_RECIPIENT_NUMBERS }}
          # Phase 5 (image pipeline) — both optional, sensible defaults/fallbacks apply if unset.
          SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
          DEFAULT_FALLBACK_IMAGE_URL: ${{ secrets.DEFAULT_FALLBACK_IMAGE_URL }}
