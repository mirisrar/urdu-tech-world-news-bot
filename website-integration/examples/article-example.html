<!doctype html>
<!-- Reference example only — Article Page wiring + Phase 10 SEO. -->
<html lang="ur" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- Defaults replaced by applyArticleSeo() after the article loads. -->
    <meta name="description" content="Nexora News Urdu — تازہ ترین اردو خبریں" />
    <meta property="og:type" content="article" />
    <meta property="og:locale" content="ur_PK" />
    <meta property="og:site_name" content="Nexora News Urdu" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>خبر — Nexora News Urdu</title>
  </head>
  <body>
    <article id="article-container">
      <p>لوڈ ہو رہا ہے...</p>
    </article>

    <script type="module">
      import { getArticleById } from "../newsApi.js";
      import { formatRelativeTime, resolveImageUrl } from "../utils.js";
      import { applyArticleSeo } from "../seo.js";
      import * as siteConfig from "../config.js";

      function renderArticle(article) {
        const container = document.getElementById("article-container");

        if (!article) {
          container.innerHTML = "<p>یہ خبر دستیاب نہیں ہے۔</p>";
          return;
        }

        // Phase 10: title + meta description + Open Graph + Twitter + canonical.
        applyArticleSeo(article, { config: siteConfig });

        container.innerHTML = `
          <img src="${resolveImageUrl(article.image_url)}" alt="${article.urdu_title}" />
          <span class="category-tag">${article.category}</span>
          <h1>${article.urdu_title}</h1>
          <span class="meta">${article.source} • ${formatRelativeTime(article.created_at)}</span>
          <p class="summary">${article.urdu_summary}</p>
          <div class="body">${article.article.replace(/\n/g, "<br>")}</div>
          <p class="hashtags">${article.hashtags || ""}</p>
          <a class="source-link" href="${article.url}" target="_blank" rel="noopener">اصل ماخذ دیکھیں</a>
        `;
      }

      async function init() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");

        if (!id) {
          renderArticle(null);
          return;
        }

        const article = await getArticleById(id);
        renderArticle(article);
      }

      init().catch((error) => {
        console.error("Failed to load article:", error);
        document.getElementById("article-container").innerHTML = "<p>خبر لوڈ کرنے میں مسئلہ پیش آیا۔</p>";
      });
    </script>
  </body>
</html>
